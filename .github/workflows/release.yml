name: Release Browser Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Extension
        run: |
          cd flow_batch_extension
          zip -r ../flow-batch-extension-${{ github.ref_name }}.zip .

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'flow-batch-extension-*.zip'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: flow-batch-extension-*.zip
          generate_release_notes: true
